[package]
name = "tts-cli"
version = "0.1.0"
edition = "2021"
description = "Convert text files to audio using VoiceStudio's local API"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentencex = "0.1"
ureq = { version = "2", features = ["json"] }
